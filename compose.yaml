services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: crowdego_hub
      POSTGRES_USER: crowdego
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdego -d crowdego_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
